<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepVisor v1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20261030a" />
  </head>
  <body>
    <!-- Column / OpenPore picker (shown after CSV upload) -->
    <div id="csv-modal" class="modal" hidden>
      <div class="modal-backdrop" data-csv-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="csv-modal-title">
        <h3 id="csv-modal-title">Choose CSV column</h3>
        <p class="modal-hint" id="csv-modal-file"></p>
        <label class="modal-field">
          Current / signal column
          <select id="csv-col-signal"></select>
        </label>
        <fieldset class="modal-fieldset">
          <legend>OpenPore</legend>
          <label class="modal-radio">
            <input type="radio" name="csv-norm" value="none" checked />
            Selected
          </label>
          <label class="modal-radio">
            <input type="radio" name="csv-norm" value="divide" />
            Enter value
            <input id="csv-op-manual" type="number" step="any" placeholder="empty = first value" />
          </label>
        </fieldset>
        <div class="modal-actions">
          <button type="button" class="secondary" data-csv-dismiss>Cancel</button>
          <button type="button" id="csv-modal-ok">Use selection</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <header>
        <h1>StepVisor <span style="font-weight:500;font-size:0.72em;opacity:0.75">v1.0</span></h1>
      </header>

      <div class="layout">
        <!-- Top: Input 1/3 | Step table 2/3 · Bottom: Stages full width -->
        <div class="top-row">
          <aside class="panel input-bar">
            <h2>Input</h2>
            <div class="input-stack">
              <label class="field field-example">
                Example
                <select id="example"></select>
              </label>
              <div class="field field-file">
                <span class="field-label">Or upload CSV</span>
                <div class="file-picker">
                  <span class="file-btn-wrap">
                    <input id="file" type="file" accept=".csv,text/csv" />
                    <label for="file" class="file-btn">Choose file</label>
                  </span>
                  <span id="file-chosen">No file chosen</span>
                </div>
              </div>
              <div class="input-actions">
                <div id="file-label">No file — using example</div>
                <div class="btn-row">
                  <button type="button" class="secondary" id="clear-file">Clear upload</button>
                  <button type="button" id="run">Run</button>
                </div>
              </div>
            </div>
          </aside>

          <section class="panel level-mid">
            <div class="level-head">
              <h2>Step table</h2>
              <button type="button" class="secondary" id="download-csv" title="Download step table as CSV">
                Download CSV
              </button>
            </div>
            <div class="table-wrap">
              <table id="level-table">
                <thead>
                  <tr>
                    <th>plateau</th>
                    <th>Median current</th>
                    <th>Duration</th>
                    <th>delta</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>

        <main class="panel stage-panel">
          <div class="stage-head">
            <h2>Stages</h2>
            <div class="tabs">
              <button type="button" class="tab" data-stage="raw">Raw</button>
              <button type="button" class="tab" data-stage="split">After split</button>
              <button type="button" class="tab" data-stage="merge">After merge</button>
              <button type="button" class="tab active" data-stage="final">Final</button>
              <button type="button" class="tab" data-stage="aligned" title="H1→0.3 height + equal-width plateau index">
                Aligned
              </button>
            </div>
          </div>
          <div class="plot-box">
            <canvas id="plot"></canvas>
          </div>
        </main>
      </div>

      <footer>
        Algorithm &amp; demo: <strong>StepVisor v1.0</strong>. Open this folder with any static
        file server, or open <code>index.html</code> directly.
      </footer>
    </div>

    <script src="js/detect.js?v=20261026a"></script>
    <script src="js/examples-fallback.js?v=20261029a"></script>
    <script src="js/examples-data.js?v=20261026a"></script>
    <script src="js/app.js?v=20261030a"></script>
  </body>
</html>
