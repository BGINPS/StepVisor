[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stairdetect"
version = "1.0.0"
description = "StepVisor v1.0: split–merge plateau detection for nanopore peptide current"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jiang Shizhe" }]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/JiangShizhe/StepVisor"
Demo = "https://JiangShizhe.github.io/StepVisor/"

[tool.setuptools.packages.find]
include = ["stairdetect*"]
